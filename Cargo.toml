[package]
name = "nifi-tls-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
p12 = "0.6.3"
pem = "4.0.0"
rand = "0.8"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
rsa = "0.9.10"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
sha1 = "0.10"
time = "0.3.55"

[dev-dependencies]
tempfile = "3"
