name: nifi-cluster-test

services:
  zookeeper:
    image: zookeeper:3.9
    hostname: zookeeper
    ports:
      - "2181:2181"

  nifi-1: &nifi-node
    image: apache/nifi:2.11.0
    entrypoint: ["/opt/nifi/custom/entrypoint-wrapper.sh"]
    hostname: nifi-1
    container_name: nifi-1
    depends_on:
      - zookeeper
    ports:
      - "8443:8443"
    environment: &nifi-env
      AUTH: tls
      KEYSTORE_PATH: /opt/nifi/nifi-current/conf/keystore.p12
      KEYSTORE_TYPE: PKCS12
      KEYSTORE_PASSWORD: nifiClusterPw1
      KEY_PASSWORD: nifiClusterPw1
      TRUSTSTORE_PATH: /opt/nifi/nifi-current/conf/truststore.jks
      TRUSTSTORE_TYPE: JKS
      TRUSTSTORE_PASSWORD: nifiClusterPw1
      NIFI_CLUSTER_IS_NODE: "true"
      NIFI_CLUSTER_NODE_PROTOCOL_PORT: "11443"
      NIFI_ZK_CONNECT_STRING: zookeeper:2181
      NIFI_ELECTION_MAX_WAIT: 1 min
      NIFI_SENSITIVE_PROPS_KEY: clusterTestSensitivePropsKey1
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
      NIFI_WEB_HTTPS_HOST: nifi-1
      NIFI_CLUSTER_ADDRESS: nifi-1
      NIFI_WEB_PROXY_HOST: "localhost:8443,nifi-1:8443"
    volumes: &nifi-volumes-1
      - ./tls/nifi-1/keystore.p12:/opt/nifi/nifi-current/conf/keystore.p12:ro
      - ./tls/nifi-1/truststore.jks:/opt/nifi/nifi-current/conf/truststore.jks:ro
      - ./authorizers.xml:/opt/nifi/custom/authorizers.xml:ro
      - ./entrypoint-wrapper.sh:/opt/nifi/custom/entrypoint-wrapper.sh:ro

  nifi-2:
    <<: *nifi-node
    hostname: nifi-2
    container_name: nifi-2
    ports:
      - "8444:8443"
    environment:
      <<: *nifi-env
      NIFI_WEB_HTTPS_HOST: nifi-2
      NIFI_CLUSTER_ADDRESS: nifi-2
      NIFI_WEB_PROXY_HOST: "localhost:8444,nifi-2:8443"
    volumes:
      - ./tls/nifi-2/keystore.p12:/opt/nifi/nifi-current/conf/keystore.p12:ro
      - ./tls/nifi-2/truststore.jks:/opt/nifi/nifi-current/conf/truststore.jks:ro
      - ./authorizers.xml:/opt/nifi/custom/authorizers.xml:ro
      - ./entrypoint-wrapper.sh:/opt/nifi/custom/entrypoint-wrapper.sh:ro

  nifi-3:
    <<: *nifi-node
    hostname: nifi-3
    container_name: nifi-3
    ports:
      - "8445:8443"
    environment:
      <<: *nifi-env
      NIFI_WEB_HTTPS_HOST: nifi-3
      NIFI_CLUSTER_ADDRESS: nifi-3
      NIFI_WEB_PROXY_HOST: "localhost:8445,nifi-3:8443"
    volumes:
      - ./tls/nifi-3/keystore.p12:/opt/nifi/nifi-current/conf/keystore.p12:ro
      - ./tls/nifi-3/truststore.jks:/opt/nifi/nifi-current/conf/truststore.jks:ro
      - ./authorizers.xml:/opt/nifi/custom/authorizers.xml:ro
      - ./entrypoint-wrapper.sh:/opt/nifi/custom/entrypoint-wrapper.sh:ro
